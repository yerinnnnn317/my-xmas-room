<title>My Christmas Room</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2d2636;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }

    color: #fff; opacity: .8; font-size: 14px; line-height: 1.5; pointer-events: none; }

    text-align: center; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #ui { position: fixed; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center;
    gap: 8px; padding: 12px 12px calc(12px + env(safe-area-inset-bottom, 0px)); pointer-events: none; }
  #ui > div { pointer-events: auto; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }

    background: rgba(45,38,54,.92); border: 1px solid rgba(255,255,255,.2); color: #fff; font-size: 14px; }
  #ui > #items, #ui > #ornPanel { max-height: 42vh; overflow-y: auto; }
  #ui > #palette, #ui > #ornPanel { flex-direction: column; align-items: stretch; flex-wrap: nowrap; }

  .swatch.sel { border: 3px solid #fff; box-shadow: 0 0 0 2px #e59a9a; }
  input[type=color] { width: 36px; height: 32px; padding: 0; border: none; background: none; cursor: pointer; }
  button { font: inherit; font-size: 14px; color: #fff; padding: 10px 14px; border-radius: 999px; cursor: pointer;
    border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.12); backdrop-filter: blur(6px); }
  button:hover { background: rgba(255,255,255,.22); }
  button:active { background: rgba(255,255,255,.32); }

  /* 기록·피드백 창 */
  #modal { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px;
    background: rgba(20,16,30,.6); z-index: 10; opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity .25s ease, visibility .25s; }
  #modal.open { opacity: 1; visibility: visible; pointer-events: auto; }
  #sheet { transform: translateY(14px) scale(.97); transition: transform .28s ease; }
  #modal.open #sheet { transform: none; }
  @keyframes panelIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes sheetIn { from { opacity: 0; } to { opacity: 1; } }
  #palette, #items, #ornPanel { animation: panelIn .22s ease; }
  #sheet > * { animation: sheetIn .25s ease; }
  @media (prefers-reduced-motion: reduce) {
    #modal, #sheet, #palette, #items, #ornPanel, #sheet > *, #sheet .leaf { transition: none !important; animation: none !important; }
  }
  #sheet .diary { padding: 16px 16px 12px; border-radius: 12px; background: #fffdf6; border: 1px solid #ead9bf;
    box-shadow: inset 4px 0 0 #e8b4b4; margin: 4px 0 4px; }
  #sheet .diary .date { font-size: 20px; font-weight: 700; }
  #sheet .diary .photo { display: block; width: 100%; max-height: 260px; object-fit: contain; margin: 10px 0 0; border-radius: 8px; background: #f3e9d9; }
  #sheet .diary .body { margin: 12px 0 0; white-space: pre-wrap; word-break: break-word; line-height: 28px; min-height: 84px;
    background: repeating-linear-gradient(transparent 0 27px, #ecdcc4 27px 28px); }
  #sheet .diary .sig { margin-top: 10px; text-align: right; font-size: 12px; opacity: .6; }
  #pad { position: fixed; left: 12px; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); z-index: 5; display: grid;
    grid-template-columns: repeat(3, 46px); grid-template-rows: repeat(3, 46px); gap: 6px; touch-action: none; user-select: none; }
  #pad button { width: 46px; height: 46px; padding: 0; font-size: 16px; touch-action: none; }
  #sheet .pages { display: flex; flex-direction: column; gap: 8px; max-height: 230px; overflow-y: auto; margin: 6px 0 4px; }
  #sheet .npage { padding: 10px 12px; border-radius: 8px; background: #fffdf6; border: 1px solid #ead9bf; box-shadow: inset 3px 0 0 #e8b4b4; font-size: 14px; }
  #sheet .npage img { display: block; width: 100%; border-radius: 6px; margin-bottom: 6px; }
  #sheet .npage .body { white-space: pre-wrap; word-break: break-word; }
  #sheet .npage small { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; opacity: .75; }
  #sheet .npage small button { padding: 2px 8px; font-size: 12px; }
  #sheet canvas.doodle { display: block; width: 100%; height: auto; border: 1px solid #dcc9b6; border-radius: 10px; background: #fffdf6; touch-action: none; cursor: crosshair; }
  #sheet .tools { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
  #sheet .tools button { padding: 5px 10px; font-size: 13px; }
  #sheet .book { perspective: 900px; margin: 6px 0; }
  #sheet .leaf { min-height: 230px; max-height: 50vh; overflow-y: auto; padding: 14px 14px 10px; border-radius: 6px 12px 12px 6px;
    background: #fffdf6; border: 1px solid #ead9bf; box-shadow: inset 6px 0 0 #e8b4b4, 2px 3px 8px rgba(0,0,0,.12);
    transform-origin: left center; transition: transform .22s ease, opacity .22s ease; touch-action: pan-y; }
  #sheet .leaf.out-next { transform: rotateY(-95deg); opacity: 0; }
  #sheet .leaf.out-prev { opacity: 0; }
  #sheet .leaf.in-prev { animation: flipBack .26s ease; }
  #sheet .leaf.in-next { animation: sheetIn .26s ease; }
  @keyframes flipBack { from { transform: rotateY(-95deg); opacity: 0; } to { transform: none; opacity: 1; } }
  #sheet .leaf img { display: block; width: 100%; border-radius: 6px; margin-bottom: 8px; }
  #sheet .leaf .body { white-space: pre-wrap; word-break: break-word; line-height: 1.6; }
  #sheet .leaf .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 12px; opacity: .8; }
  #sheet .leaf .foot button { padding: 2px 8px; font-size: 12px; }
  #sheet .pager { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 6px 0; }
  #sheet .pager button:disabled { opacity: .35; cursor: default; }
  #sheet .post .pfoot { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; font-size: 12px; opacity: .85; }
  #sheet .post .pfoot button { padding: 2px 8px; font-size: 12px; }
  #sheet input[type=range] { width: 100%; }
  #sheet .rooms { display: flex; flex-direction: column; gap: 6px; max-height: 38vh; overflow-y: auto; margin: 6px 0; }
  #sheet .roomrow { text-align: left; border-radius: 12px; padding: 10px 12px; }
  #intro { position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); z-index: 9; width: max-content;
    max-width: min(92vw, 400px); box-sizing: border-box; padding: 14px 16px; border-radius: 16px; text-align: center;
    background: rgba(22,28,36,.9); color: #f3f6fa; border: 1px solid rgba(255,255,255,.14); backdrop-filter: blur(8px);
    opacity: 0; transform: translate(-50%, 12px); pointer-events: none; transition: opacity .35s ease, transform .35s ease; }
  #intro.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  #intro h3 { margin: 0 0 6px; font-size: 15px; }
  #intro p { margin: 0 0 12px; font-size: 13px; line-height: 1.55; opacity: .85; }
  #intro .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  #intro button.primary { background: #f1f4f8; color: #1b2430; border-color: #f1f4f8; }
  #sheet .drop { padding: 18px 12px; border: 2px dashed #dcc9b6; border-radius: 12px; background: #fff; text-align: center;
    font-size: 13px; line-height: 1.5; cursor: pointer; margin-top: 4px; }
  #sheet .drop.over { background: #f6d9d6; border-color: #e59a9a; }
  #sheet img.prev { display: block; max-width: 100%; max-height: 180px; margin-top: 8px; border-radius: 8px; }
  #sheet { position: relative; width: 100%; max-width: 460px; max-height: 88vh; overflow-y: auto; box-sizing: border-box;
    padding: 20px 18px 18px; border-radius: 20px; background: #fff8f0; color: #4a3b30; line-height: 1.5; font-size: 15px; }
  #sheet h2 { margin: 0 32px 2px 0; font-size: 19px; }
  #sheet .sub { margin: 0 0 12px; font-size: 13px; opacity: .7; }
  #sheet label, #sheet .lab { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 4px; }
  #sheet select, #sheet input[type=text], #sheet input[type=email], #sheet input[type=password], #sheet textarea { font: inherit; font-size: 15px; color: #4a3b30; background: #fff;
    border: 1px solid #dcc9b6; border-radius: 10px; padding: 8px 10px; box-sizing: border-box; }
  #sheet textarea { width: 100%; min-height: 110px; resize: vertical; }
  #sheet input[type=text], #sheet input[type=email], #sheet input[type=password] { width: 100%; margin-top: 6px; }
  #sheet .msg { min-height: 20px; margin-top: 8px; font-size: 13px; color: #b04a4a; white-space: pre-line; }
  #sheet .or { text-align: center; font-size: 12px; opacity: .6; margin: 12px 0 2px; }
  #sheet .tips { white-space: pre-line; font-size: 14px; line-height: 1.7; margin: 8px 0; }
  #sheet .inline { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  #sheet .btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  #sheet button { color: #4a3b30; background: #f3e3d0; border: 1px solid #dcc9b6; backdrop-filter: none; }
  #sheet button.primary { background: #e59a9a; color: #fff; border-color: #e59a9a; }
  #sheet button.danger { background: #fff; color: #b04a4a; border-color: #e3b3b3; }
  #sheet #mClose { position: absolute; top: 10px; right: 10px; padding: 6px 10px; }
  #sheet .chips { display: flex; gap: 8px; }
  #sheet label.chip { position: relative; display: inline-block; margin: 0; padding: 8px 14px; font-size: 15px; font-weight: 400;
    border-radius: 999px; border: 1px solid #dcc9b6; background: #fff; cursor: pointer; user-select: none; }
  #sheet label.chip.on { background: #f6d9d6; border-color: #e59a9a; font-weight: 600; }
  #sheet label.chip:focus-within { outline: 2px solid #e59a9a; outline-offset: 2px; }
  #sheet label.chip input { position: absolute; opacity: 0; pointer-events: none; }
  #sheet .posts { display: flex; flex-direction: column; gap: 8px; max-height: 200px; overflow-y: auto; margin-top: 6px; }
  #sheet .post { padding: 10px 12px; border-radius: 6px; box-shadow: 0 2px 4px rgba(0,0,0,.15); font-size: 14px;
    white-space: pre-wrap; word-break: break-word; }
  #sheet .post small { display: block; margin-top: 6px; text-align: right; opacity: .65; }
  #sheet .note { font-size: 12px; opacity: .65; margin-top: 10px; }
  #sheet .err { font-size: 13px; color: #b04a4a; min-height: 1.2em; margin-top: 6px; }
  #sheet .info { margin: 0 0 6px; padding: 10px 12px; border-radius: 12px; background: #f6ece0; font-size: 13px; line-height: 1.55; }
  #ui .desc { flex: 0 0 100%; text-align: center; font-size: 13px; line-height: 1.55; opacity: .85; }
</style>

<body>
<div id="hint">가구를 눌러서 끌면 옮길 수 있어요. 🎄 트리, 📖 책꽂이, 🖼️ 액자, 🪧 게시판, 📓 책상 위 노트, 🧊 냉장고, 🪟 커튼은 눌러 보세요!<br>빈 곳을 끌면 방이 돌아가고, 마우스 휠(두 손가락)로 확대·축소돼요.<br>왼쪽 아래 방향 버튼으로 시점을 옮기고, 👁️ “방 안에서 보기”로 방 안에 서서 둘러볼 수도 있어요.</div>
<div id="toast"></div>
<div id="ui">
  <div id="actions">
    <button id="smaller">작게</button>
    <button id="bigger">크게</button>
    <button id="rot">회전</button>
    <button id="lightBtn">💡 켜기/끄기</button>
    <button id="del">삭제</button>
  </div>
  <div id="palette"></div>
  <div id="items"></div>
  <div id="ornPanel"></div>
  <div id="catalog"></div>
</div>
<div id="modal"><div id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="intro" role="region" aria-live="polite"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

// ── 서버 설정 (Supabase) ──  비워 두면 서버 없이 이 브라우저에만 저장하는 혼자용으로 동작해요
const SUPABASE_URL = 'https://aqqxqluqogwxbbdbtdbv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_sK5sweglcc8IVdq7f4IdEg_Php6uMwj';
const SAVE_KEY = 'xmas-room-v1';
const FEEDBACK_KEY = 'xmas-room-feedback-v1';
const FONT = "'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif";
const MAX_LIGHTS = 7;
const MAX_ORN = 40;
const IMG_RE = /^data:image\/(jpeg|png|webp|gif);base64,[A-Za-z0-9+/=]+$/;
let loading = true;
let visit = false;                      // true: 남의 방을 구경하는 중 (고칠 수 없어요)
let sb = null;                          // 서버 연결 (설정이 없으면 null)
let me = null;                          // 로그인한 사람
const ctx = { id: null, mine: true, name: '' };   // 지금 보고 있는 방

// ── 기본 세팅 ──
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2d2636);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 100);
camera.position.set(4, 6, 9);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1, 0);
controls.maxPolarAngle = Math.PI / 2.05;

// ── 밤의 기본 빛 + 방 불 (방 불을 켜면 밝아져요) ──
const ambient = new THREE.AmbientLight(0xdcd8f5, 0.5);
scene.add(ambient);
const moon = new THREE.DirectionalLight(0xb8c4ff, 0.35);
moon.position.set(2, 6, 5);
scene.add(moon);
const roomLight = new THREE.PointLight(0xffe6c4, 0, 0);
roomLight.position.set(0, 4.6, 0);
scene.add(roomLight);
let roomOn = false;

// ── 모양 만드는 도구들 ──
const matCache = {};
const M = (c) => matCache[c] || (matCache[c] = new THREE.MeshStandardMaterial({ color: c, roughness: 0.85 }));
function box(g, w, h, d, color, x, y, z) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), M(color));
  m.position.set(x, y, z);
  g.add(m);
  return m;
}
function rb(g, w, h, d, color, x, y, z, r = 0.06) {   // 모서리가 둥근 상자 (푹신한 느낌)
  const rad = Math.min(r, w / 2 - 0.001, h / 2 - 0.001, d / 2 - 0.001);
  const m = new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 4, rad), M(color));
  m.position.set(x, y, z);
  g.add(m);
  return m;
}
function cyl(g, rt, rbm, h, color, x, y, z) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rbm, h, 28), M(color));
  m.position.set(x, y, z);
  g.add(m);
  return m;
}
function sph(g, r, color, x, y, z, sx = 1, sy = 1, sz = 1) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12), M(color));
  m.position.set(x, y, z);
  m.scale.set(sx, sy, sz);
  g.add(m);
  return m;
}
function starGeo(outer, inner, depth) {
  const sh = new THREE.Shape();
  for (let i = 0; i < 10; i++) {
    const r = i % 2 ? inner : outer, a = (i / 10) * Math.PI * 2 + Math.PI / 2;
    if (i) sh.lineTo(Math.cos(a) * r, Math.sin(a) * r); else sh.moveTo(Math.cos(a) * r, Math.sin(a) * r);
  }
  sh.closePath();
  const geo = new THREE.ExtrudeGeometry(sh, { depth, bevelEnabled: false });
  geo.translate(0, 0, -depth / 2);
  return geo;
}
function starMesh(outer, inner, depth, color) {
  return new THREE.Mesh(starGeo(outer, inner, depth), new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.8 }));
}

// ── 방: 벽은 한 면만 보이는 판이라서, 벽 뒤에서 보면 사라져요 ──
const floorMat = new THREE.MeshStandardMaterial({ color: 0xc4a484, roughness: 0.9 });
const wallMat = new THREE.MeshStandardMaterial({ color: 0xe9d9cb, roughness: 0.95 });
const room = new THREE.Group();
const floor = new THREE.Mesh(new THREE.BoxGeometry(9.8, 0.2, 9.8), floorMat);
floor.position.y = -0.1;
room.add(floor);
const backWall = new THREE.Mesh(new THREE.PlaneGeometry(9.8, 5), wallMat);
backWall.position.set(0, 2.5, -4.9);
room.add(backWall);
const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(9.8, 5), wallMat);
leftWall.position.set(-4.9, 2.5, 0);
leftWall.rotation.y = Math.PI / 2;
room.add(leftWall);
const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(9.8, 5), wallMat);
rightWall.position.set(4.9, 2.5, 0);
rightWall.rotation.y = -Math.PI / 2;
room.add(rightWall);
const frontWall = new THREE.Mesh(new THREE.PlaneGeometry(9.8, 5), wallMat);
frontWall.position.set(0, 2.5, 4.9);
frontWall.rotation.y = Math.PI;
room.add(frontWall);
const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(9.8, 9.8), wallMat);
ceiling.position.set(0, 5, 0);
ceiling.rotation.x = Math.PI / 2;
room.add(ceiling);
scene.add(room);

// ── 창문: 눈 내리는 밤하늘 (매 프레임 다시 그려요) ──
const winC = document.createElement('canvas');
winC.width = 128; winC.height = 256;
const winX = winC.getContext('2d');
const winTex = new THREE.CanvasTexture(winC);
winTex.colorSpace = THREE.SRGBColorSpace;
const winGrad = winX.createLinearGradient(0, 0, 0, 256);
winGrad.addColorStop(0, '#141a42');
winGrad.addColorStop(0.65, '#3f3f7a');
winGrad.addColorStop(1, '#a07a92');
const nightStars = Array.from({ length: 18 }, () => ({ x: Math.random() * 128, y: Math.random() * 110, r: 0.3 + Math.random() * 0.9 }));
const flakes = Array.from({ length: 70 }, () => ({
  x: Math.random() * 128, y: Math.random() * 256, r: 0.8 + Math.random() * 1.8, v: 0.25 + Math.random() * 0.6, ph: Math.random() * 6.3,
}));
function drawWindow(t) {
  winX.fillStyle = winGrad;
  winX.fillRect(0, 0, 128, 256);
  winX.fillStyle = 'rgba(255,246,220,.9)';
  nightStars.forEach((s) => { winX.beginPath(); winX.arc(s.x, s.y, s.r, 0, 6.3); winX.fill(); });
  winX.fillStyle = '#fff3d6';
  winX.beginPath(); winX.arc(96, 34, 10, 0, 6.3); winX.fill();   // 달
  winX.fillStyle = 'rgba(255,255,255,.9)';
  flakes.forEach((f) => {
    f.y += f.v;
    if (f.y > 260) { f.y = -4; f.x = Math.random() * 128; }
    winX.beginPath();
    winX.arc(f.x + Math.sin(t * 0.8 + f.ph) * 5, f.y, f.r, 0, 6.3);
    winX.fill();
  });
  winTex.needsUpdate = true;
}
drawWindow(0);

// 창문 틀 + 반투명 커튼 (여닫을 수 있어요)
const winGroup = new THREE.Group();
const curtain = { L: null, R: null, t: 1, target: 1 };   // 1 = 열림, 0 = 닫힘
(function makeWindow() {
  const g = winGroup;
  const glass = new THREE.Mesh(new THREE.PlaneGeometry(2.2, 2.4), new THREE.MeshBasicMaterial({ map: winTex }));
  glass.position.z = 0.01;
  g.add(glass);
  const fr = 0xfff4e6;
  box(g, 2.5, 0.12, 0.14, fr, 0, 1.26, 0.05);
  box(g, 2.5, 0.12, 0.14, fr, 0, -1.26, 0.05);
  box(g, 0.12, 2.64, 0.14, fr, -1.19, 0, 0.05);
  box(g, 0.12, 2.64, 0.14, fr, 1.19, 0, 0.05);
  box(g, 0.08, 2.4, 0.1, fr, 0, 0, 0.04);

function wrapLines(ctx, text, maxW, maxLines) {
  const lines = [];
  let cur = '';
  let cut = false;
  for (const ch of text.replace(/\s+/g, ' ').trim()) {
    if (ctx.measureText(cur + ch).width > maxW) {
      lines.push(cur);
      cur = ch === ' ' ? '' : ch;
      if (lines.length === maxLines) { cut = true; break; }
    } else cur += ch;
  }
  if (!cut && cur) lines.push(cur);
  if (cut) lines[maxLines - 1] = lines[maxLines - 1].replace(/.$/, '…');
  return lines;
}

  c.fillStyle = bg;
  c.fillRect(0, 0, W, H);
  let seed = 7;                                   // 매번 같은 모양의 잔점
  const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  for (let i = 0; i < 500; i++) {
    c.fillStyle = rnd() > 0.5 ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.08)';

function createItem(def, variant) {

// 크기: userData.size가 사용자가 정한 크기, 탁자/침대 위에 있으면 그 크기만큼 보정해요
function applyScale(it) {
  const hosted = it.parent && it.parent !== scene && it.userData.hostKind;
  it.scale.setScalar(hosted ? it.userData.size / it.parent.scale.x : it.userData.size);
  it.children.forEach((c) => { if (c.userData.hostKind) applyScale(c); });
}

// ── 겹침 방지 (바닥 가구의 위에서 본 사각형 겹침 검사, 카펫은 예외) ──
function box2(it, x = it.position.x, z = it.position.z, rot = it.rotation.y, s = it.scale.x) {
  const [fx, fz] = it.userData.fp;
  return { x, z, c: Math.cos(rot), s: Math.sin(rot), hx: fx * s, hz: fz * s };
}
function overlap(a, b) {
  const axes = [[a.c, -a.s], [a.s, a.c], [b.c, -b.s], [b.s, b.c]];
  const dx = b.x - a.x, dz = b.z - a.z;
  const rad = (q, nx, nz) => q.hx * Math.abs(nx * q.c - nz * q.s) + q.hz * Math.abs(nx * q.s + nz * q.c);
  return axes.every(([nx, nz]) => Math.abs(dx * nx + dz * nz) < rad(a, nx, nz) + rad(b, nx, nz) + 0.02);
}
function collides(it, x, z, rot, s) {
  if (it.userData.flat) return false;
  const a = box2(it, x, z, rot, s);
  return items.some((o) => o !== it && o.parent === scene && o.userData.fp && !o.userData.flat && overlap(a, box2(o)));
}
function extent(it, rot = it.rotation.y, s = it.scale.x) {
  const [fx, fz] = it.userData.fp;
  const c = Math.abs(Math.cos(rot)), n = Math.abs(Math.sin(rot));
  return [(c * fx + n * fz) * s, (n * fx + c * fz) * s];
}
function fits(it, x, z, rot, s) {
  const [ex, ez] = extent(it, rot, s);
  return Math.abs(x) <= 4.85 - ex && Math.abs(z) <= 4.85 - ez && !collides(it, x, z, rot, s);
}
function tryMove(it, x, z) {
  const [ex, ez] = extent(it);
  const cx = Math.max(-4.85 + ex, Math.min(4.85 - ex, x));
  const cz = Math.max(-4.85 + ez, Math.min(4.85 - ez, z));
  const px = it.position.x, pz = it.position.z;
  for (const [nx, nz] of [[cx, cz], [cx, pz], [px, cz]]) {
    if (!collides(it, nx, nz)) { it.position.x = nx; it.position.z = nz; return true; }
  }
  return false;
}

function lightCount() { return items.filter((i) => i.userData.toggle).length; }
function lightFull() {
  if (lightCount() >= MAX_LIGHTS) { toast('빛이 나는 소품은 최대 ' + MAX_LIGHTS + '개까지 놓을 수 있어요.'); return true; }
  return false;
}

function addFloorItem(def) {
  if (def.light && lightFull()) return null;
  const g = createItem(def);
  g.scale.setScalar(g.userData.size);
  const cand = [];
  for (let x = -4.5; x <= 4.5; x += 0.5) for (let z = -4.5; z <= 4.5; z += 0.5) cand.push([x, z]);
  cand.sort((a, b) => Math.hypot(a[0], a[1] - 1.5) - Math.hypot(b[0], b[1] - 1.5));
  for (const [x, z] of cand) {
    if (fits(g, x, z)) {
      g.position.set(x, 0, z);
      scene.add(g);
      items.push(g);
      save();
      return g;

// ── 오너먼트: 트리 위에 걸리는 자리 ──
function treeRadius(y) {
  let r = 0;
  TIERS.forEach(([R, h, cy]) => {
    const base = cy - h / 2;
    if (y >= base && y <= base + h) r = Math.max(r, R * (1 - (y - base) / h));
  });
  return r;
}
// 기본 카메라(4, 9)가 있는 쪽을 앞으로 보고, 앞쪽 반원에만 달아요 (앞쪽 가운데부터 채워요)
function slotPos(k, tree) {
  const y = 1.25 + ((k * 0.6180339) % 1) * 2.3;
  const fx = 4 - tree.position.x, fz = 9 - tree.position.z;
  const front = Math.atan2(fz, fx) + tree.rotation.y;
  const half = (30 + 55 * Math.min(1, k / 24)) * Math.PI / 180;
  const a = front + (((k * 0.7548777) % 1) - 0.5) * 2 * half;
  const r = treeRadius(y - 0.3) + 0.12;   // 걸리는 부분이 가지 바깥에 오도록
  return { x: Math.cos(a) * r, y, z: Math.sin(a) * r, ry: Math.PI / 2 - a };
}
function targetTree() {
  if (selected && selected.userData.kind === 'tree') return selected;
  return items.find((i) => i.userData.kind === 'tree');
}
function nextSlot(tree) {
  const used = new Set(ornaments.filter((o) => o.parent === tree).map((o) => o.userData.slot));
  for (let k = 0; k < MAX_ORN; k++) if (!used.has(k)) return k;
  return -1;
}
function tintOrnament(o) {
  o.userData.mats.forEach((m) => { if (m.emissive && !m.userData.keepEmissive) m.emissive.copy(m.color); });
}
function addOrnament(tree, shape, col, slot, rec) {
  const def = ORN.find((o) => o.id === shape);
  if (!def || !tree) return null;
  const g = def.build(col);
  const mats = new Set();
  g.traverse((m) => { if (m.isMesh) mats.add(m.material); });
  g.userData = { isOrnament: true, shape, col, slot, rec: rec || null, mats: [...mats], phase: Math.random() * 6.3 };
  const p = slotPos(slot, tree);
  g.position.set(p.x, p.y, p.z);
  g.rotation.y = p.ry;
  g.scale.setScalar(1.2);
  tree.add(g);
  ornaments.push(g);
  if (rec) tintOrnament(g);
  return g;
}
function removeOrnament(o) {
  const i = ornaments.indexOf(o);
  if (i < 0) return;
  ornaments.splice(i, 1);
  o.parent.remove(o);
  save();
}

const modalEl = document.getElementById('modal');

function el(tag, props, kids) {

  (kids || []).forEach((k) => n.append(k));
  return n;
}
function openModal(buildFn, onClose) {

function validImg(v, allowLink = true) {
  if (typeof v !== 'string') return false;
  if (v.length < 700000 && IMG_RE.test(v)) return true;
  return allowLink && v.length < 2000 && /^https?:\/\/\S+$/.test(v);
}
function loadImgEl(src, cors) {
  return new Promise((res, rej) => {
    const im = new Image();
    if (cors) im.crossOrigin = 'anonymous';
    im.referrerPolicy = 'no-referrer';
    im.onload = () => res(im);
    im.onerror = () => rej(new Error('load'));
    im.src = src;
  });
}
function drawToJpeg(im) {
  const k = Math.min(1, 640 / Math.max(im.width, im.height));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(im.width * k));
  c.height = Math.max(1, Math.round(im.height * k));
  const x = c.getContext('2d');
  x.fillStyle = '#fff';
  x.fillRect(0, 0, c.width, c.height);
  x.drawImage(im, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.72);
}
async function photoFromFile(file) {
  try { return drawToJpeg(await createImageBitmap(file)); } catch (e) { /* 다른 방법으로 */ }
  try {
    const url = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(new Error('read')); r.readAsDataURL(file); });
    return drawToJpeg(await loadImgEl(url, false));
  } catch (e) { /* 마지막 방법 */ }
  const url = URL.createObjectURL(file);
  try { return drawToJpeg(await loadImgEl(url, false)); } finally { URL.revokeObjectURL(url); }
}
async function photoFromUrl(url, allowLink) {
  try { return drawToJpeg(await loadImgEl(url, true)); } catch (e) { /* 다른 사이트 사진은 복사가 막혀 있을 수 있어요 */ }
  if (/^https?:/.test(url)) {   // 복사가 막힌 사이트는 이미지 변환 서비스를 거쳐서 가져와요 (wsrv.nl, weserv, Photon 순서)
    const bare = url.replace(/^https?:\/\//, '');
    const proxies = [
      'https://wsrv.nl/?w=640&output=jpg&url=' + encodeURIComponent(url),
      'https://images.weserv.nl/?w=640&output=jpg&url=' + encodeURIComponent(url),
      'https://i0.wp.com/' + bare + (bare.includes('?') ? '&' : '?') + 'w=640',
    ];
    for (const px of proxies) { try { return drawToJpeg(await loadImgEl(px, true)); } catch (e) { /* 다음 서비스 */ } }
  }
  if (allowLink && /^https?:/.test(url)) { await loadImgEl(url, false); return url; }   // 복사가 막힌 사진은 링크로 보여줘요
  throw new Error('blocked');
}
function urlsFromDrop(dt) {
  const out = [];
  const h = dt.getData('text/html');
  if (h) {
    const im = new DOMParser().parseFromString(h, 'text/html').querySelector('img');
    if (im && im.getAttribute('src')) out.push(im.getAttribute('src'));
  }
  (dt.getData('text/uri-list') || '').split('\n').forEach((l) => { if (l && !l.startsWith('#')) out.push(l); });
  const t = (dt.getData('text/plain') || '').trim();
  if (t) out.push(t);
  return out.map((u) => (u.trim().startsWith('//') ? 'https:' + u.trim() : u.trim())).filter((u) => /^(https?:|data:image)/.test(u));
}
// 사진 넣는 칸: 끌어다 놓기 / 붙여넣기 / 파일 고르기
function makePhotoPicker(initial, allowLink, onChange, hidePrev) {
  let img = validImg(initial, allowLink) ? initial : null;
  const zone = el('div', { className: 'drop', tabIndex: 0, textContent: '📷 저장해 둔 사진은 아래 “파일 선택”으로 고르거나 여기로 끌어다 놓아 주세요. 인터넷에서 본 사진도 그대로 끌어다 놓거나, 복사해서 붙여넣기(Ctrl+V) 할 수 있어요.' });
  zone.setAttribute('role', 'button');
  const fileIn = el('input', { type: 'file', accept: 'image/*' });
  fileIn.style.cssText = 'display:block;margin:8px 0 0;font-size:13px;max-width:100%';
  fileIn.setAttribute('aria-label', '사진 파일 고르기');
  const prev = el('img', { className: 'prev', alt: '선택한 사진 미리보기' });
  prev.referrerPolicy = 'no-referrer';
  const drop = el('button', { type: 'button', textContent: '사진 빼기' });
  const err = el('div', { className: 'err' });
  err.setAttribute('aria-live', 'polite');
  const show = () => {
    prev.style.display = img && !hidePrev ? 'block' : 'none';
    drop.style.display = img ? '' : 'none';
    if (img) prev.src = img;
    if (onChange) onChange(img);
  };
  show();
  const take = (p) => {
    err.textContent = '사진을 불러오는 중…';
    return p.then((d) => { img = d; err.textContent = ''; show(); })
      .catch((e) => { err.textContent = (e && e.message === 'none' ? '이 사진은 바로 가져올 수 없었어요. (사이트가 막았거나, 이 화면에서 인터넷 사진을 불러올 수 없어요.) ' : '사진 파일을 읽지 못했어요. ') + '사진 위에서 우클릭 → “이미지 복사”를 한 뒤 Ctrl+V로 붙여넣거나, 저장한 사진 파일을 아래 “파일 선택”으로 올려 주세요.'; });
  };
  const firstOk = async (urls) => {
    for (const u of urls) { try { return await photoFromUrl(u, allowLink); } catch (e) { /* 다음 후보 */ } }
    throw new Error('none');
  };
  const fromFiles = (files) => { const f = [...(files || [])].find((x) => x.type.startsWith('image/')); if (f) { take(photoFromFile(f)); return true; } return false; };
  zone.addEventListener('click', () => fileIn.click());
  zone.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileIn.click(); } });
  sheet.ondragover = (e) => { e.preventDefault(); zone.classList.add('over'); };
  sheet.ondragleave = (e) => { if (!sheet.contains(e.relatedTarget)) zone.classList.remove('over'); };
  sheet.ondrop = (e) => {
    e.preventDefault();
    zone.classList.remove('over');
    if (fromFiles(e.dataTransfer.files)) return;
    const urls = urlsFromDrop(e.dataTransfer);
    if (urls.length) take(firstOk(urls)); else err.textContent = '사진을 찾지 못했어요. 사진 파일이나 인터넷 사진을 끌어다 놓아 주세요.';
  };
  const urlIn = el('input', { type: 'text', placeholder: '또는 사진 주소(https://…)를 붙여넣고 Enter' });
  urlIn.setAttribute('aria-label', '사진 주소');
  urlIn.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    const u = urlIn.value.trim();
    if (/^https?:\/\/\S+$/.test(u)) { take(firstOk([u])); urlIn.value = ''; } else err.textContent = 'https://로 시작하는 사진 주소를 넣어 주세요.';
  });
  fileIn.addEventListener('change', () => { fromFiles(fileIn.files); fileIn.value = ''; });
  drop.addEventListener('click', () => { img = null; show(); });
  pasteHandler = (e) => { if (fromFiles(e.clipboardData && e.clipboardData.files)) e.preventDefault(); };
  const node = el('div', {}, [zone, fileIn, urlIn, el('div', { className: 'inline' }, [drop]), prev, err]);
  return { node, get: () => img };
}
function dateText(rec) {
  if (rec.m && rec.d) return rec.m + '월 ' + rec.d + '일';

}

// 책을 끌면 가까운 빈 칸(또는 다른 책과 자리 바꾸기)에 꽂아요
function moveBook(e) {
  if (!draggingBook) return;
  setPointer(e);
  let best = null;
  items.forEach((sh) => {
    if (!sh.userData.slots || !sh.visible) return;
    const n = new THREE.Vector3(Math.sin(sh.rotation.y), 0, Math.cos(sh.rotation.y));
    const plane = new THREE.Plane().setFromNormalAndCoplanarPoint(n, sh.localToWorld(new THREE.Vector3(0, 0, 0.18)));
    const hit = new THREE.Vector3();
    if (!raycaster.ray.intersectPlane(plane, hit)) return;
    const l = sh.worldToLocal(hit);
    for (let i = 0; i < BOOK_SLOTS; i++) {
      const q = bookSlotPos(i);
      const d = Math.hypot(l.x - q.x, l.y - q.y);
      if (d < 0.3 && (!best || d < best.d)) best = { d, sh, i };
    }
  });
  if (!best) return;
  const b = draggingBook;
  const other = best.sh.userData.slots[best.i];
  if (other === b) return;
  const from = b.parent, fi = b.userData.slot;
  from.userData.slots[fi] = null;
  if (other) placeBook(from, other, fi);
  placeBook(best.sh, b, best.i);
  if (down) down.moved = true;
}

function openNoteRead(start) {
  openModal((s) => {

    s.append(el('p', { className: 'sub', textContent: '이 방에 온 사람들이 남긴 페이지예요. 책장을 넘기듯 ◀ ▶ 버튼이나 좌우로 쓸어서 넘겨 보세요.' }));

    const nextB = el('button', { type: 'button', textContent: '다음 ▶' });
    const no = el('span');
    const fill = () => {
      const n = notes[i];
      const d = new Date(n.ts);
      leaf.replaceChildren();
      if (validImg(n.img, false)) leaf.append(el('img', { src: n.img, alt: '낙서' }));
      if (n.text) leaf.append(el('div', { className: 'body', textContent: n.text }));
      const del = el('button', { type: 'button', textContent: '지우기' });
      armButton(del, '한 번 더 누르면 지워져요', () => { notes.splice(i, 1); saveNotes(); deleteRemote('notes', n); openNoteRead(Math.min(i, notes.length - 1)); });
      leaf.append(el('div', { className: 'foot' }, [el('span', { textContent: '- ' + (n.name || '익명') + ' · ' + (d.getMonth() + 1) + '.' + d.getDate() }), ...(visit ? [] : [del])]));
      no.textContent = (i + 1) + ' / ' + notes.length;
      prevB.disabled = i === 0;
      nextB.disabled = i === notes.length - 1;
    };
    let busy = false;
    const go = (dir) => {
      const j = i + dir;
      if (busy || j < 0 || j >= notes.length) return;
      busy = true;
      leaf.classList.add(dir > 0 ? 'out-next' : 'out-prev');
      setTimeout(() => {
        i = j;
        fill();
        leaf.style.transition = 'none';
        leaf.classList.remove('out-next', 'out-prev');
        void leaf.offsetWidth;
        leaf.style.transition = '';
        leaf.classList.add(dir > 0 ? 'in-next' : 'in-prev');
        setTimeout(() => { leaf.classList.remove('in-next', 'in-prev'); busy = false; }, 280);
      }, 230);
    };
    prevB.addEventListener('click', () => go(-1));
    nextB.addEventListener('click', () => go(1));
    let sx = null;
    leaf.addEventListener('pointerdown', (e) => { sx = e.clientX; });
    leaf.addEventListener('pointerup', (e) => { if (sx !== null && Math.abs(e.clientX - sx) > 50) go(e.clientX < sx ? 1 : -1); sx = null; });
    fill();
    s.append(book, el('div', { className: 'pager' }, [prevB, no, nextB]));

    const hx = range('좌우 위치', 'ox', 0, 1, 0.01);
    const syncUI = () => { zoom.inp.value = cfg.zoom; vy.inp.value = cfg.oy; hx.inp.value = cfg.ox; };
    const mk = (label, fn) => { const b = el('button', { type: 'button', textContent: label }); b.addEventListener('click', () => { fn(); syncUI(); redraw(); }); return b; };
    const fitRow = el('div', { className: 'tools' }, [
      mk('꽉 채우기', () => { cfg.fit = 'cover'; }),

      mk('⬆ 위쪽 부분', () => { cfg.oy = 0; if (cfg.zoom < 1.01 && cfg.fit === 'cover') cfg.zoom = 1; }),
      mk('가운데', () => { cfg.oy = 0.5; }),
      mk('⬇ 아래쪽 부분', () => { cfg.oy = 1; }),
    ]);
    let drag = null;
    pv.addEventListener('pointerdown', (e) => { pv.setPointerCapture(e.pointerId); drag = { x: e.clientX, y: e.clientY, ox: cfg.ox, oy: cfg.oy }; pv.style.cursor = 'grabbing'; });
    pv.addEventListener('pointermove', (e) => {

// ── 카메라가 가까이 다가가고, 아래에 짧은 설명 카드가 떠요 ──
let camSaved = null;
let fly = null;
const introEl = document.getElementById('intro');
function flyTo(pos, target, ms = 900) {
  fly = { p0: camera.position.clone(), t0: controls.target.clone(), p1: pos, t1: target, s: performance.now(), ms };
  controls.enabled = false;
}
function stepFly() {
  if (!fly) return;
  let k = (performance.now() - fly.s) / fly.ms;
  const done = k >= 1;
  k = Math.min(1, k);
  const e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
  camera.position.lerpVectors(fly.p0, fly.p1, e);
  controls.target.lerpVectors(fly.t0, fly.t1, e);
  if (done) { fly = null; controls.enabled = true; }
}
function focusItem(item, dist, wall) {
  const c = new THREE.Box3().setFromObject(item).getCenter(new THREE.Vector3());
  let d;
  if (wall) d = new THREE.Vector3(Math.sin(item.rotation.y), 0, Math.cos(item.rotation.y));
  else { d = camera.position.clone().sub(c); d.y = 0; d.normalize(); }
  if (!camSaved) camSaved = { p: camera.position.clone(), t: controls.target.clone() };
  const pos = c.clone().addScaledVector(d, dist);
  if (!wall) pos.y = c.y + 1.4;
  flyTo(pos, c);
}
function returnCam() {
  if (!camSaved) return;
  flyTo(camSaved.p, camSaved.t);
  camSaved = null;
}
function hideIntro() { introEl.classList.remove('show'); }
function showIntro(title, desc, buttons) {

      btn.addEventListener('click', b.fn);

    })));
  introEl.classList.add('show');
}

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const floorPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const wallBack = new THREE.Plane(new THREE.Vector3(0, 0, 1), 4.9);
const wallLeft = new THREE.Plane(new THREE.Vector3(1, 0, 0), 4.9);
const up = new THREE.Vector3(0, 1, 0);
const dragOffset = new THREE.Vector2();
let dragging = null;
let draggingBook = null;

function setPointer(e) {
  const r = renderer.domElement.getBoundingClientRect();
  pointer.x = ((e.clientX - r.left) / r.width) * 2 - 1;
  pointer.y = -((e.clientY - r.top) / r.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
}
function findItem(obj) {
  let o = obj;
  while (o && !o.userData.isItem) o = o.parent;
  return o;
}
function findOrnament(obj) {
  let o = obj;
  while (o && !o.userData.isOrnament && !o.userData.isItem) o = o.parent;

// 책상·탁자·침대 윗면에서 포인터가 가리키는 위치 (그 가구 기준 좌표)
function hitHostTop(h, forceClamp) {
  const plane = new THREE.Plane(up, -(h.position.y + h.userData.surfaceY * h.scale.x));
  const p = new THREE.Vector3();
  if (!raycaster.ray.intersectPlane(plane, p)) return null;
  const l = h.worldToLocal(p);
  const [hx, hz] = h.userData.topHalf;
  const inside = Math.abs(l.x) <= hx && Math.abs(l.z) <= hz;
  if (!inside && !forceClamp) return null;
  l.x = Math.max(-hx, Math.min(hx, l.x));
  l.z = Math.max(-hz, Math.min(hz, l.z));
  return l;
}
function dragHosted(it) {
  let host = null, l = null;
  for (const h of items) {
    if (h.userData.hosts !== it.userData.hostKind || h.parent !== scene) continue;
    l = hitHostTop(h, false);
    if (l) { host = h; break; }
  }
  if (host) {
    if (it.parent !== host) host.add(it);
    applyScale(it);
    it.position.set(l.x, host.userData.surfaceY, l.z);
    return true;
  }
  if (it.userData.hostRequired) {
    host = it.parent;
    l = hitHostTop(host, true);
    if (l) it.position.set(l.x, host.userData.surfaceY, l.z);
    return true;
  }
  return false;
}
// 벽 소품: 뒷벽이나 왼쪽 벽 위에서만 움직이고, 벽 밖으로 나가지 않아요
function dragWall(it) {
  const a = new THREE.Vector3(), b = new THREE.Vector3();
  const hitA = raycaster.ray.intersectPlane(wallBack, a) && Math.abs(a.x) <= 4.9;
  const hitB = raycaster.ray.intersectPlane(wallLeft, b) && Math.abs(b.z) <= 4.9;
  const o = raycaster.ray.origin;
  let onBack;
  if (hitA && (!hitB || o.distanceTo(a) < o.distanceTo(b))) onBack = true;
  else if (hitB) onBack = false;
  else return;
  const p = onBack ? a : b;
  const s = it.scale.x;
  const lim = Math.max(0, 4.85 - (it.userData.wallHalf || 0.2) * s);
  const hy = (it.userData.wallHalfH || 0.3) * s;
  const y = Math.max(hy + 0.1, Math.min(4.9 - hy, snap(p.y)));
  const h = Math.max(-lim, Math.min(lim, snap(onBack ? p.x : p.z)));
  it.rotation.y = onBack ? 0 : Math.PI / 2;
  if (onBack) it.position.set(h, y, -4.9); else it.position.set(-4.9, y, h);
}

  if (visit) return;   // 구경 모드: 가구는 옮길 수 없어요

addEventListener('pointermove', (e) => {
  if (draggingBook) { if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6) moveBook(e); return; }

  if (dragging.parent !== scene) {
    scene.attach(dragging);
    dragging.position.y = 0;
    applyScale(dragging);
    dragOffset.set(0, 0);
  }
  tryMove(dragging, snap(p.x + dragOffset.x), snap(p.z + dragOffset.y));
});

function placeItem(def, x, y, z, ry, size, variant) {
  const g = createItem(def, variant);
  if (size) g.userData.size = size;
  g.scale.setScalar(g.userData.size);
  g.position.set(x, y, z);
  g.rotation.y = ry || 0;
  scene.add(g);
  items.push(g);
  return g;

function stepWalk() {
  const f = padState.f - padState.b, r = padState.r - padState.l, turn = padState.tl - padState.tr, zoom = padState.zi - padState.zo;
  const up = new THREE.Vector3(0, 1, 0);
  if (inside) {
    if (turn) {   // 서서 고개 돌리기
      const d = controls.target.clone().sub(camera.position).applyAxisAngle(up, turn * 0.03);
      controls.target.copy(camera.position).add(d);
    }
    if (zoom) { camera.fov = Math.max(35, Math.min(85, camera.fov - zoom * 0.6)); camera.updateProjectionMatrix(); }
    if ((f || r) && !seated) {
      const dir = new THREE.Vector3();
      camera.getWorldDirection(dir);
      dir.y = 0;
      dir.normalize();
      const right = new THREE.Vector3(-dir.z, 0, dir.x);
      const mv = dir.multiplyScalar(f).add(right.multiplyScalar(r)).normalize().multiplyScalar(0.05);
      const nx = Math.max(-4.4, Math.min(4.4, camera.position.x + mv.x));
      const nz = Math.max(-4.4, Math.min(4.4, camera.position.z + mv.z));
      controls.target.x += nx - camera.position.x;
      controls.target.z += nz - camera.position.z;
      camera.position.x = nx;
      camera.position.z = nz;
    }
  } else if (!fly) {
    const dist = camera.position.distanceTo(controls.target);
    if (turn) {   // 방 둘레를 돌기
      const o = camera.position.clone().sub(controls.target).applyAxisAngle(up, turn * 0.025);
      camera.position.copy(controls.target).add(o);
    }
    if (zoom) {   // 가까이 / 멀리
      const k = Math.max(3, Math.min(18, dist * (1 - zoom * 0.02))) / dist;
      camera.position.copy(controls.target).add(camera.position.clone().sub(controls.target).multiplyScalar(k));
    }
    if (f || r) {   // 보는 곳 옮기기
      const dir = controls.target.clone().sub(camera.position);
      dir.y = 0;
      if (dir.lengthSq() < 1e-6) dir.set(0, 0, -1);
      dir.normalize();
      const right = new THREE.Vector3(-dir.z, 0, dir.x);
      const sp = Math.max(0.04, dist * 0.012);
      const mv = dir.multiplyScalar(f).add(right.multiplyScalar(r)).normalize().multiplyScalar(sp);
      const tx = Math.max(-5.5, Math.min(5.5, controls.target.x + mv.x));
      const tz = Math.max(-5.5, Math.min(5.5, controls.target.z + mv.z));
      camera.position.x += tx - controls.target.x;
      camera.position.z += tz - controls.target.z;
      controls.target.x = tx;
      controls.target.z = tz;
    }
    const t = controls.target;
    t.x = Math.max(-5.5, Math.min(5.5, t.x));
    t.y = Math.max(0, Math.min(4, t.y));
    t.z = Math.max(-5.5, Math.min(5.5, t.z));
  }
}

    sb = mod.createClient(SUPABASE_URL, SUPABASE_KEY);

    await uploadRoom();
    toast('방 파일을 내 방으로 불러왔어요!');
  } catch (e) { toast('방 파일을 읽지 못했어요. “방 백업 파일”로 만든 room.json 인지 확인해 주세요.'); }
});
function exportRoom() {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(serialize())], { type: 'application/json' }));
  a.download = 'room.json';
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  toast('room.json 파일로 저장했어요!');
}
function openLink() {
  const url = location.origin + location.pathname + '?room=' + me.id;
  openModal((s) => {
    s.append(el('h2', { textContent: '🔗 내 방 링크' }));
    s.append(el('div', { className: 'info', textContent: '이 링크를 친구에게 보내면 내 방을 구경할 수 있어요. 구경하는 사람은 방을 고칠 수 없고, 노트와 게시판에 글을 남길 수 있어요.' }));
    const inp = el('input', { type: 'text', value: url, readOnly: true });
    inp.setAttribute('aria-label', '내 방 링크');
    inp.addEventListener('focus', () => inp.select());
    s.append(inp);
    const copy = el('button', { className: 'primary', textContent: '복사하기' });
    copy.addEventListener('click', () => {
      inp.select();
      (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(() => toast('링크를 복사했어요!')).catch(() => toast('링크를 길게 눌러(또는 Ctrl+C) 복사해 주세요.'));
    });
    s.append(el('div', { className: 'btns' }, [copy]));
  });
}
async function openRooms() {
  let listEl = null;
  openModal((s) => {
    s.append(el('h2', { textContent: '🔎 방 구경하기' }));
    s.append(el('div', { className: 'info', textContent: '다른 사람들의 방을 구경하며 인테리어 아이디어를 얻어 보세요. 구경하는 방은 주인만 고칠 수 있고, 노트와 게시판에는 글을 남길 수 있어요.' }));
    listEl = el('div', { className: 'rooms' }, [el('div', { className: 'note', textContent: '방을 불러오는 중…' })]);
    s.append(listEl);
    if (me) {
      s.append(el('label', { htmlFor: 'rname', textContent: '내 방 이름' }));
      const nm = el('input', { id: 'rname', type: 'text', maxLength: 20, value: ctx.mine ? ctx.name : myRoomName() ? myRoomName() + '의 방' : '', placeholder: '예) 민지의 방' });
      s.append(nm);
      const save = el('button', { textContent: '이름 저장' });
      save.addEventListener('click', async () => {
        const v = nm.value.trim().slice(0, 20);
        const { error } = await sb.from('rooms').update({ name: v }).eq('owner', me.id);
        if (error) { toast('이름을 저장하지 못했어요. 내 방을 먼저 만들어 주세요.'); return; }
        if (ctx.mine) { ctx.name = v; refreshUI(); }
        toast('방 이름을 바꿨어요!');
      });
      const out = el('button', { textContent: '로그아웃' });
      out.addEventListener('click', async () => { await sb.auth.signOut(); location.href = location.pathname; });
      s.append(el('div', { className: 'btns' }, [save, out]));
    } else {
      const li = el('button', { className: 'primary', textContent: '✨ 로그인해서 내 방 만들기' });
      li.addEventListener('click', () => openLanding());
      s.append(el('div', { className: 'btns' }, [li]));
    }
  });
  try {
    const [rs, fs] = await Promise.all([
      sb.from('rooms').select('owner,name,updated_at').order('updated_at', { ascending: false }).limit(50),
      sb.from('featured').select('owner').limit(1).maybeSingle(),
    ]);
    if (!listEl || !listEl.isConnected) return;
    listEl.replaceChildren();
    const fid = fs.data ? fs.data.owner : null;
    const rows = (rs.data || []).slice().sort((a, b) => (b.owner === fid) - (a.owner === fid));
    if (!rows.length) listEl.append(el('div', { className: 'note', textContent: '아직 만들어진 방이 없어요.' }));
    rows.forEach((r) => {
      const label = (r.owner === fid ? '⭐ 대표 방 · ' : '') + (r.name || '이름 없는 방') + (me && r.owner === me.id ? ' (내 방)' : '');
      const b = el('button', { className: 'roomrow', textContent: label });
      b.addEventListener('click', async () => {
        closeModal();
        if (!(await enterRoom(r.owner))) toast('방을 불러오지 못했어요.');
      });
      listEl.append(b);
    });
  } catch (e) {
    if (listEl) listEl.replaceChildren(el('div', { className: 'note', textContent: '방 목록을 불러오지 못했어요.' }));
  }
}
function refreshUI() {
  const edit = !visit;
  itemsBtn.style.display = edit ? '' : 'none';
  colorBtn.style.display = edit ? '' : 'none';
  roomsBtn.style.display = sb ? '' : 'none';
  loginBtn.style.display = sb && !me ? '' : 'none';
  myRoomBtn.style.display = sb && me && visit ? '' : 'none';
  linkBtn.style.display = sb && me && edit && ctx.id ? '' : 'none';
  exportBtn.style.display = edit ? '' : 'none';
  importBtn.style.display = sb && me && edit ? '' : 'none';
  const name = ctx.name || (visit ? '친구의 방' : '내 방');
  const lines = visit
    ? ['🎁 ' + name + ' 구경 중! 트리의 오너먼트, 책꽂이의 책을 눌러 보고, 책상 위 노트와 게시판에는 글을 남길 수 있어요.', '빈 곳을 끌면 방이 돌아가요. 왼쪽 아래 버튼으로 시점을 옮길 수 있어요.']
    : ['🏠 ' + name, '가구를 눌러서 끌면 옮길 수 있어요. 🎄 트리, 📖 책꽂이, 🖼️ 액자, 🪧 게시판, 📓 책상 위 노트, 🧊 냉장고, 🪟 커튼은 눌러 보세요!', '빈 곳을 끌면 방이 돌아가고, 마우스 휠(두 손가락)로 확대·축소돼요.'];
  if (!storageOk && !sb) lines.push('⚠️ 이 화면에서는 저장이 되지 않아요. 크롬 같은 브라우저에서 열어야 방이 유지돼요.');
  document.getElementById('hint').textContent = lines.join('\n');
}
async function boot() {
  document.getElementById('hint').textContent = '방을 불러오는 중…';
  await initBackend();
  try {
    if (!sb) { bootOffline(); return; }
    const q = new URLSearchParams(location.search).get('room');
    let done = false;
    if (q && /^[0-9a-f-]{36}$/i.test(q) && !(me && q === me.id)) done = await enterRoom(q);
    if (!done && me) { await enterOwnRoom(); done = true; }
    if (!done) { await enterFeatured(); if (!me) openLanding(); }
  } catch (e) {
    toast('서버에서 방을 불러오지 못했어요. 이 브라우저에 저장된 방을 열게요.');
    sb = null;
    bootOffline();
  }
}
// ── 처음 화면(로그인), 이메일 가입, 첫 환영 ──
function openLanding() {
  if (!sb) return;
  openModal((s) => {
    s.append(el('h2', { textContent: '🎄 나만의 크리스마스 방' }));
    s.append(el('div', { className: 'sub', textContent: '로그인하면 내 방을 만들고 꾸밀 수 있어요. 다른 사람들이 꾸민 방도 구경할 수 있어요.' }));
    const g = el('button', { className: 'primary', textContent: '구글로 시작하기' });
    g.style.width = '100%';
    g.addEventListener('click', signIn);
    s.append(g);
    s.append(el('div', { className: 'or', textContent: '또는 이메일로' }));
    const em = el('input', { type: 'email', placeholder: '이메일', autocomplete: 'email' });
    em.setAttribute('aria-label', '이메일');
    const pw = el('input', { type: 'password', placeholder: '비밀번호 (6자 이상)', autocomplete: 'current-password' });
    pw.setAttribute('aria-label', '비밀번호');
    const msg = el('div', { className: 'msg' });
    const say = (t) => { msg.textContent = t; };
    s.append(em, pw);
    const inBtn = el('button', { className: 'primary', textContent: '로그인' });
    const upBtn = el('button', { textContent: '처음이에요 (회원가입)' });
    inBtn.addEventListener('click', () => emailAuth('in', em.value.trim(), pw.value, say, [inBtn, upBtn]));
    upBtn.addEventListener('click', () => emailAuth('up', em.value.trim(), pw.value, say, [inBtn, upBtn]));
    pw.addEventListener('keydown', (e) => { if (e.key === 'Enter') inBtn.click(); });
    s.append(el('div', { className: 'btns' }, [inBtn, upBtn]), msg);
    const look = el('button', { textContent: '로그인 없이 구경만 할게요' });
    look.addEventListener('click', closeModal);
    s.append(el('div', { className: 'btns' }, [look]));
  });
}
async function emailAuth(mode, email, pw, say, btns) {
  if (!/^\S+@\S+\.\S+$/.test(email)) { say('이메일 주소를 확인해 주세요.'); return; }
  if (pw.length < 6) { say('비밀번호는 6자 이상이어야 해요.'); return; }
  btns.forEach((b) => { b.disabled = true; });
  say('잠시만요…');
  try {
    const r = mode === 'up' ? await sb.auth.signUp({ email, password: pw }) : await sb.auth.signInWithPassword({ email, password: pw });
    if (r.error) {
      const m = String(r.error.message || '');
      say(/invalid login/i.test(m) ? '이메일이나 비밀번호가 맞지 않아요.\n처음이라면 “처음이에요”를 눌러 주세요.'
        : /already registered/i.test(m) ? '이미 가입된 이메일이에요. “로그인”을 눌러 주세요.'
        : /not confirmed/i.test(m) ? '메일로 보낸 확인 링크를 먼저 눌러 주세요.'
        : /rate limit|too many/i.test(m) ? '시도가 너무 많아요. 잠시 뒤에 다시 해 주세요.'
        : '실패했어요. 잠시 뒤에 다시 해 주세요.');
      return;
    }
    if (!r.data || !r.data.session) { say('확인 메일을 보냈어요. 메일의 링크를 누른 뒤 “로그인”을 눌러 주세요.'); return; }
    me = r.data.user;
    closeModal();
    await enterOwnRoom();
  } catch (e) {
    say('연결에 실패했어요. 인터넷을 확인해 주세요.');
  } finally {
    btns.forEach((b) => { b.disabled = false; });
  }
}
function showWelcome() {
  openModal((s) => {
    s.append(el('h2', { textContent: '🎁 내 방이 만들어졌어요!' }));
    s.append(el('div', { className: 'sub', textContent: '트리만 놓여 있는 빈 방이에요. 나만의 크리스마스 방으로 꾸며 보세요.' }));
    s.append(el('div', { className: 'tips', textContent: '🛋️ “소품” 버튼으로 가구를 놓고, 눌러서 끌면 옮길 수 있어요\n🎄 트리를 눌러 오너먼트에 추억을 걸어 보세요\n🎨 “방 색”으로 벽과 바닥 색을 바꿔요\n🔗 “내 방 링크”를 친구에게 보내면 구경하러 와요\n💾 꾸민 건 자동으로 저장돼요' }));
    s.append(el('label', { htmlFor: 'wname', textContent: '내 방 이름 (구경하는 사람들에게 보여요)' }));
    const nm = el('input', { id: 'wname', type: 'text', maxLength: 20, value: ctx.name, placeholder: '예) 민지의 방' });
    s.append(nm);
    const go = el('button', { className: 'primary', textContent: '방 꾸미러 가기' });
    go.addEventListener('click', async () => {
      const v = nm.value.trim().slice(0, 20);
      if (v && v !== ctx.name) {
        ctx.name = v;
        const { error } = await sb.from('rooms').update({ name: v }).eq('owner', me.id);
        if (error) toast('방 이름을 저장하지 못했어요. 나중에 다시 바꿔 주세요.');
        refreshUI();
      }
      closeModal();
    });
    s.append(el('div', { className: 'btns' }, [go]));
  });
}

boot();
</script>
